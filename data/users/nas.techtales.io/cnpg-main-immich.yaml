---
apiVersion: terraform.techtales.io/v1alpha1
kind: MinioUser
metadata:
  name: cnpg-main-immich
  namespace: nas.techtales.io
spec:
  description: cnpg backup user for immich database
  disabled: false
  permissions:
    - bucket: cnpg
      path: /*
      actions:
        - ListBucket
    - bucket: cnpg
      path: /main/immich/*
      actions:
        - "*"
