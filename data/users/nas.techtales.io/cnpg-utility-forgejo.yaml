---
apiVersion: terraform.techtales.io/v1alpha1
kind: MinioUser
metadata:
  name: cnpg-utility-forgejo
  namespace: nas.techtales.io
spec:
  description: cnpg backup user for forgejo database
  disabled: false
  permissions:
    - bucket: cnpg
      path: /*
      actions:
        - ListBucket
    - bucket: cnpg
      path: /utility/forgejo/*
      actions:
        - "*"
