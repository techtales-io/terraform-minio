---
apiVersion: terraform.techtales.io/v1alpha1
kind: MinioUser
metadata:
  name: litestream-new-api
  namespace: nas.techtales.io
spec:
  description: litestream backup account for new-api
  disabled: false
  permissions:
    - bucket: litestream
      path: /*
      actions:
        - ListBucket
    - bucket: litestream
      path: /new-api/*
      actions:
        - GetObject
        - PutObject
        - DeleteObject
