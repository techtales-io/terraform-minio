---
apiVersion: terraform.techtales.io/v1alpha1
kind: MinioUser
metadata:
  name: volsync-main-influxdb3-data
  namespace: nas.techtales.io
spec:
  description: volsync main backup account
  disabled: false
  permissions:
    - bucket: volsync
      path: /*
      actions:
        - ListBucket
    - bucket: volsync
      path: /main/influxdb/influxdb3-data/*
      actions:
        - GetObject
        - PutObject
        - DeleteObject
