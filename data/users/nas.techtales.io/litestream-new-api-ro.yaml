---
# Recovery identity: read-only restore key, used from a clean machine, never resident on a host.
apiVersion: terraform.techtales.io/v1alpha1
kind: MinioUser
metadata:
  name: litestream-new-api-ro
  namespace: nas.techtales.io
spec:
  description: litestream backup account for new-api readonly
  disabled: false
  permissions:
    - bucket: litestream
      path: /*
      actions:
        - ListBucket
    - bucket: litestream
      path: /new-api/*
      actions:
        - GetObject
